<div class="navbar-wrapper">
  <!-- Navbar unificata: Logo + Search + Link di navigazione -->
  <nav class="navbar navbar-unified" [class.checkout-navbar]="isCheckoutPage">
    <div class="navbar-container-unified">
      <!-- Top row: Logo + Search + Icons -->
      <div class="navbar-top-row">
        <a routerLink="/" class="navbar-logo" aria-label="Home">
          <img src="/00logo.png" alt="Mediaworld Logo" class="navbar-logo-img" />
        </a>

        @if(!isCheckoutPage) {
        <div class="search-container">
          <form class="search-form" (ngSubmit)="onSearch()">
            <div class="search-input-wrapper">
              <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.35-4.35"></path>
              </svg>
              <input 
                type="text" 
                class="search-input" 
                placeholder="Cosa stai cercando?" 
                [(ngModel)]="searchQuery"
                name="searchQuery"
              />
            </div>
          </form>
        </div>
        }

        <div class="navbar-actions">
          @if(!isCheckoutPage) {
            <a routerLink="/login" class="navbar-icon" aria-label="Account" title="Account">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </a>
            
            <a (click)="onCartClick($event)" class="navbar-icon cart-icon" aria-label="Carrello" title="Carrello" style="cursor: pointer;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
              @if(cartCount > 0) {
                <span class="cart-badge">{{ cartCount }}</span>
              }
            </a>
          } @else {
            <div class="secure-payment">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>PAGAMENTO SICURO</span>
            </div>
          }
        </div>
      </div>

      <!-- Bottom row: Navigation links -->
      @if(!isCheckoutPage) {
      <div class="navbar-bottom-row">
        <ul class="navbar-menu" [class.active]="menuActive">
          <li>
            <a routerLink="/home" routerLinkActive="active" class="nav-link">Home</a>
          </li>
          <li>
            <a routerLink="/tv" routerLinkActive="active" class="nav-link">TV</a>
          </li>
          <li>
            <a routerLink="/elettrodomestici" routerLinkActive="active" class="nav-link">Elettrodomestici</a>
          </li>
          <li>
            <a routerLink="/telefoni" routerLinkActive="active" class="nav-link">Telefoni</a>
          </li>
          <li>
            <a routerLink="/contatti" routerLinkActive="active" class="nav-link">Contatti</a>
          </li>
        </ul>
      </div>
      }
    </div>
  </nav>
</div>
